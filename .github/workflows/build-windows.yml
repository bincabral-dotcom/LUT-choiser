name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar aplicativo portátil
        run: >
          dotnet publish src/LutChoice/LutChoice.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishReadyToRun=true
          --output artifacts/LUT-Choice

      - name: Instalar FFmpeg para a distribuição
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg) { throw 'FFmpeg não foi encontrado após a instalação.' }
          New-Item -ItemType Directory -Force -Path artifacts/LUT-Choice/ffmpeg | Out-Null
          Copy-Item $ffmpeg.FullName artifacts/LUT-Choice/ffmpeg/ffmpeg.exe
          Copy-Item THIRD-PARTY-NOTICES.txt artifacts/LUT-Choice/
          $licenseCandidates = Get-ChildItem $ffmpeg.Directory.FullName -Recurse -Include 'LICENSE*','COPYING*' -ErrorAction SilentlyContinue
          if ($licenseCandidates) {
            New-Item -ItemType Directory -Force -Path artifacts/LUT-Choice/licenses | Out-Null
            $licenseCandidates | ForEach-Object { Copy-Item $_.FullName artifacts/LUT-Choice/licenses/ }
          }

      - name: Criar ZIP da distribuição
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/LUT-Choice/* -DestinationPath artifacts/LUT-Choice-win-x64.zip -Force

      - name: Publicar download
        uses: actions/upload-artifact@v4
        with:
          name: LUT-Choice-win-x64
          path: artifacts/LUT-Choice-win-x64.zip
          if-no-files-found: error
          retention-days: 30
